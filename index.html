  try{
    const html=await dec(pass);
    try{localStorage.setItem(KEYNAME,pass)}catch(e){}
    document.open();document.write(html);document.close();
    try{
      const ageH=(Date.now()-PUB_TS)/3600000;
      if(ageH>24){
        const days=Math.floor(ageH/24);
        const bar=document.createElement("div");
        bar.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99999;background:#DC2626;color:#fff;padding:10px 14px;font:600 13px -apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer";
        bar.textContent="\u26a0 \u0414\u0430\u043d\u043d\u044b\u0435 \u043c\u043e\u0433\u043b\u0438 \u0443\u0441\u0442\u0430\u0440\u0435\u0442\u044c (\u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u043e "+(days>=1?days+" \u0434\u043d. \u043d\u0430\u0437\u0430\u0434":"\u0431\u043e\u043b\u0435\u0435 \u0441\u0443\u0442\u043e\u043a \u043d\u0430\u0437\u0430\u0434")+"). \u041e\u0431\u043d\u043e\u0432\u0438\u0442\u0435 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0443.";
        bar.onclick=()=>location.reload(true);
        document.body.appendChild(bar);
      }
    }catch(e){}
  }catch(e){
    btn.disabled=false;st.textContent="";
    if(silent){try{localStorage.removeItem(KEYNAME)}catch(_){}}
    else err.textContent="Неверный пароль";
  }
}
document.getElementById("f").addEventListener("submit",ev=>{ev.preventDefault();openDash(pw.value,false);});
window.addEventListener("load",()=>{
  let saved=null; try{saved=localStorage.getItem(KEYNAME)}catch(e){}
  if(saved)openDash(saved,true);
});
</script>
