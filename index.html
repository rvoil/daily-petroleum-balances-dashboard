const KEYNAME="rvoil_gsm_pw";
const btn=document.getElementById("btn"),err=document.getElementById("err"),
      st=document.getElementById("st"),pw=document.getElementById("pw");
async function dec(pass){
  const raw=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16),nonce=raw.slice(16,28),ct=raw.slice(28);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:310000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:nonce},key,ct);
  return new TextDecoder().decode(pt);
}
async function openDash(pass,silent){
  err.textContent="";st.textContent="Открываю…";btn.disabled=true;
  try{
    const html=await dec(pass);
    try{localStorage.setItem(KEYNAME,pass)}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    btn.disabled=false;st.textContent="";
    if(silent){try{localStorage.removeItem(KEYNAME)}catch(_){}}
    else err.textContent="Неверный пароль";
  }
}
document.getElementById("f").addEventListener("submit",ev=>{ev.preventDefault();openDash(pw.value,false);});
window.addEventListener("load",()=>{
  let saved=null; try{saved=localStorage.getItem(KEYNAME)}catch(e){}
  if(saved)openDash(saved,true);
});
</script>
